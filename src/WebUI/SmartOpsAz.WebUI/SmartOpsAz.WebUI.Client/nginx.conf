
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/identity/ {
        proxy_pass http://identity-api:8080/;
    }

    location /api/inventory-service/ {
        proxy_pass http://inventory-api:8080/;
    }

    location /api/device-service/ {
        proxy_pass http://device-api:8080/;
    }

    location /api/dashboard-service/ {
        proxy_pass http://dashboard-api:8080/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
